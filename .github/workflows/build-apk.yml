name: Compilar APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm ci || npm install
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: fronton-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk fronton.apk
      - uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: ultima
          name: Frontón (última versión)
          body: APK de prueba (debug). Instalar permitiendo apps de origen desconocido.
          files: fronton.apk
          make_latest: true
